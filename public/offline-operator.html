<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d9488" />
    <title>Parcela — Offline</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: #eef2f6;
        color: #0f172a;
      }
      .card {
        max-width: 24rem;
        width: 100%;
        border-radius: 1rem;
        border: 1px solid #e2e8f0;
        background: #fff;
        padding: 1.5rem;
        box-shadow: 0 8px 32px -8px rgb(15 23 42 / 0.12);
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.5;
        color: #64748b;
      }
      button {
        margin-top: 1.25rem;
        width: 100%;
        border: 0;
        border-radius: 0.75rem;
        background: #0d9488;
        color: #fff;
        font-size: 0.8125rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 0.75rem 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You&apos;re offline</h1>
      <p>
        Parcela Counter can still show your last synced parcels and queue verify or release actions.
        Reconnect to refresh live data.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
