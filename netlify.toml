[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # Same-origin proxy — browser calls /api on Netlify; Netlify forwards to Render.
  NEXT_PUBLIC_API_URL = "/api"
  API_PROXY_TARGET = "https://parcela-9lhg.onrender.com"
